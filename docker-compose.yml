# Pinned so this file and the root compose file resolve to the SAME project.
# Every service sets an explicit container_name, which is global rather than
# project-scoped, so two projects can never hold the same service at once.
name: devboard-ic

services:
  devboard-core:
    build:
      context: .
    container_name: devboard-core
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
    ports:
      - "18003:8000"
    networks:
      - devboard-ic-network

networks:
  devboard-ic-network:
    name: devboard-ic-network
    external: true